    <text x="8" y="33" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#FFF">TQ</text>
    <circle cx="68" cy="22" r="22" fill="#D32F2F" />
    <text x="54" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFF">Cert</text>
