<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldHafeez" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#C9A45C" />
      <stop offset="100%" stopColor="#8C6C30" />
    </linearGradient>
  </defs>
  <!-- 40 Years Badge -->
  <g transform="translate(10, 15)">
    <text x="0" y="55" font-family="'Times New Roman', serif" font-weight="bold" font-size="64" fill="#24211E">40</text>
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#24211E" letter-spacing="1">YEARS OF</text>
    <text x="75" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#24211E" letter-spacing="1">DISTINCTION</text>
  </g>
  <!-- Hafeez Contractor Typography -->
  <g transform="translate(175, 20)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#C9A45C" letter-spacing="4">ARCHITECT</text>
    <text x="0" y="54" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#24211E" letter-spacing="1.5">HAFEEZ</text>
    <text x="0" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#24211E" letter-spacing="1.5">CONTRACTOR</text>
  </g>
</svg>